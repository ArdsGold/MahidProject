<!doctype html>
<html><head><title>Login ampblogs.com</title></head><body>
  <main>
    <a href="/">Homepage</a>
    <form class="sign-in-existing" method="post">
      <input name="username" type="text" placeholder="Username">
      <input name="password" type="password" placeholder="Password">
      <input id="rememberMeSignIn" name="rememberMe" type="checkbox">
      <a class="forgot-password" href="#">Forgot password</a>
      <div>Assemble the puzzle captcha</div>
      <div id="KEY-Captcha"><div id="puzzleContainer"><div id="puzzle"></div><div id="logo_key_captcha"></div><div id="validPuzzle"></div></div></div>
      <button class="butt green sign-in-button" name="login" type="submit">Sign in</button>
      <button class="butt blue sign-in-facebook-v2" type="button">Sign in with Facebook</button>
      <button class="butt red sign-in-google-new" type="button">Sign in with Google</button>
      <button class="butt blue-light sign-in-twitter" type="button">Sign in with Twitter</button>
    </form>
  </main>
</body></html>
