<!doctype html>
<html><head><title>Sign In | AmpBlogs</title></head><body>
  <main>
    <h1>Sign In</h1>
    <a href="/signup">Register a new account</a>
    <form>
      <label for="login-username">Username</label><input id="login-username" name="username" autocomplete="username">
      <label for="login-password">Password</label><input id="login-password" name="password" type="password">
      <div id="KEY-Captcha"><div id="puzzleContainer"></div></div>
      <button type="submit" name="login" class="sign-in-button">Sign In</button>
      <button type="button" class="sign-in-facebook-v2">SIGN IN WITH FACEBOOK</button>
      <button type="button" class="sign-in-google-new">SIGN IN WITH GOOGLE</button>
    </form>
    <a href="#">Facebook</a><a href="#">Google</a>
  </main>
</body></html>
