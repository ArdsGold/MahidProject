<!doctype html>
<html><head><title>Sign Up | AmpBlogs</title></head><body>
  <main>
    <h1>Create your account</h1>
    <a href="/login">Already have an account? Sign In</a>
    <form>
      <label for="username">Username</label><input id="username" name="username" autocomplete="username">
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email">
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password">
      <div class="captcha-register" data-sitekey="fixture-site-key"><input name="captcha"><img id="captcha" src="/captcha.php"></div>
      <label><input id="agree" name="agree" type="checkbox"> I agree to the Terms and Conditions</label>
      <button id="register" name="register" type="submit">Create Account</button>
      <button type="button" class="sign-in-facebook-v2">SIGN IN WITH FACEBOOK</button>
      <button type="button" class="sign-in-google-new">SIGN IN WITH GOOGLE</button>
    </form>
    <a href="#">Facebook</a><a href="#">Google</a>
  </main>
</body></html>
